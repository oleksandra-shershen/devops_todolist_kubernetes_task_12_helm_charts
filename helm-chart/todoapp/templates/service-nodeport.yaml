apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-nodeport
  namespace: {{ .Values.namespace.name }}
spec:
  type: NodePort
  selector:
    app: {{ .Chart.Name }}
  ports:
  - protocol: TCP
    port: {{ .Values.service.nodePort.port }}
    targetPort: {{ .Values.service.nodePort.targetPort }}
    nodePort: {{ .Values.service.nodePort.nodePort }}
