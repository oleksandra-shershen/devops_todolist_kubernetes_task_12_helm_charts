# Default values for the todoapp umbrella chart.

namespace:
  name: todoapp

serviceAccount:
  name: secrets-reader

image:
  repository: ikulyk404/todoapp
  tag: "4.0.1"
  pullPolicy: IfNotPresent

replicaCount: 2

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "150m"
  limits:
    memory: "256Mi"
    cpu: "150m"

affinity:
  nodeAffinity:
    key: app
    operator: In
    values:
      - todoapp
    weight: 1

configMap:
  PYTHONUNBUFFERED: "1"

# Secrets are base64-encoded, exactly as they would appear under `data:` in a
# native Secret manifest. Populated into the Secret template via `range`.
secrets:
  SECRET_KEY: QGUyKHl4KXYmdGdoM19zPTB5amEtaSFkcGVieHN6XmRnNDd4KS1rJmtxXzN6Zio5ZSoK
  DB_NAME: "YXBwX2RiCg=="
  DB_USER: "YXBwX3VzZXI="
  DB_PASSWORD: "MTIzNA=="
  DB_HOST: "bXlzcWwtMC5teXNxbC5teXNxbC5zdmMuY2x1c3Rlci5sb2NhbAo="

service:
  clusterIP:
    port: 80
    targetPort: 8080
  nodePort:
    port: 80
    targetPort: 8080
    nodePort: 30007

ingress:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  path: /(|$)(.*)

probes:
  liveness:
    path: api/health
    port: 8080
    initialDelaySeconds: 60
    periodSeconds: 5
  readiness:
    path: api/ready
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

hpa:
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70
  memoryUtilization: 70

pv:
  name: pv-data
  storageClassName: standard
  reclaimPolicy: Delete
  accessModes:
    - ReadWriteMany
  capacity: 1Gi
  hostPath: /data/

pvc:
  name: pvc-data
  accessModes:
    - ReadWriteMany
  storage: 1Gi

rbac:
  create: true

# --- Sub-chart (mysql) values ---
# These override charts/mysql/values.yaml when set here, since Helm merges
# parent values into subcharts under a key matching the subchart name.
mysql:
  namespace:
    name: mysql
  image:
    repository: mysql
    tag: "8.0"
  replicaCount: 2
  secrets:
    MYSQL_ROOT_PASSWORD: "MTIzNA=="
    MYSQL_USER: "YXBwX3VzZXI="
    MYSQL_PASSWORD: "MTIzNA=="
  mysqlDatabase: app_db
  pvc:
    storage: 2Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  affinity:
    key: app
    values:
      - mysql
  toleration:
    key: app
    value: mysql
    effect: NoSchedule
